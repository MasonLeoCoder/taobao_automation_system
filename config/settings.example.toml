# 项目配置模板：程序默认读取 config/settings.toml，不自动读取本文件。
# 仅首次部署时复制为 settings.toml，再在本机填写 MySQL 密码。
# 后续更新项目时逐项补充配置，保留已有密码和本机值，不覆盖整个实际配置。
# 修改后重启 CLI 任务和 Web 服务，再运行 python main.py database check 只读核对。
# 相对路径均基于项目根目录；可用 ECOMMERCE_ROOT 指定根目录。
workspace = "workspace" # 运行资料目录；未配置时也使用 workspace。
shop_name = "我的店铺" # 店铺显示名称；未配置时也使用此值。

[browser]
headless = false # 是否隐藏浏览器窗口；可选 true/false，默认 false。
timeout_ms = 60000 # 页面操作超时，正整数毫秒，默认 60000。
# 千牛独立登录资料；省略时自动选择默认路径，并兼容存在的旧资料。
# session_path = "workspace/storage/sessions/qianniu.json"
# profile_path = "workspace/storage/browser_profiles/qianniu"

[taobao]
browser_channel = "chrome" # 本模板使用已安装的 Chrome；可选 chrome/msedge，省略用自带 Chromium。
browser_mode = "native_cdp" # 本模板使用普通 Chrome 连接；可选 native_cdp/playwright，省略默认 playwright。
# native_cdp 要求 browser_channel="chrome" 且 headless=false；新机器需安装 Chrome。
# 淘宝与千牛使用独立登录资料；以下为省略配置时的默认路径。
# session_path = "workspace/storage/sessions/taobao.json"
# profile_path = "workspace/storage/browser_profiles/taobao"

[taobao.pacing]
# 页面就绪后的随机间隔，单位秒，格式 [最小值, 最大值]；以下均为代码默认值。
before_search = [2, 4] # 填写关键词后、点击搜索前。
search = [2, 4] # 搜索结果就绪后。
scroll = [1.5, 3] # 分段滚动之间。
page = [4, 8] # 翻页后。
keyword = [8, 15] # 多关键词之间。
question = [4, 8] # 问大家逐题操作之间。
question_rest = [30, 60] # 每 10 题或连续操作 5 分钟后的休息。

[taobao.module_timeouts]
# 各详情模块无进展超时，整数毫秒且至少 1000；以下均为默认值 120000。
basic_info = 120000 # 商品基本信息。
video = 120000 # 视频。
main_images = 120000 # 主图。
skus = 120000 # SKU 规格。
parameters = 120000 # 商品参数。
detail_images = 120000 # 详情图片。
review_summary = 120000 # 评价概览。
reviews = 120000 # 评价明细。
questions = 120000 # 问大家。

[bilibili]
# B站单个视频不限大小；以下容量仅用于提醒，不阻止下载。页面高级设置可覆盖本库选项。
# 临时目录省略时使用 workspace/output/temp；可指定其他本机磁盘，已有记录不自动搬迁。
# temp_dir = "D:/VideoTemp"
cache_warn_gib = 20 # 缓存提醒容量，单位GiB，不小于0；0关闭提醒。
idle_hours = 24 # 完成/已取消缓存的闲置期限，整数小时1～8760；暂停/失败待恢复不自动清理。
# 修改配置文件后重启服务；页面应用设置立即生效于新记录，覆盖项存于本库的本地运行目录。

[web]
host = "127.0.0.1" # 仅本机访问；可选 127.0.0.1/localhost/::1，默认 127.0.0.1。
port = 8000 # 监听端口，整数 1～65535，默认 8000；CLI --port 可覆盖。

[storage]
# 本模板启用 MySQL；缺少配置时的代码兼容默认值仍为 sqlite/files。
task_backend = "mysql" # 任务与日志；可选 mysql/sqlite。
collection_backend = "mysql" # 结构化采集；可选 mysql/files，mysql 要求任务存储也为 mysql。
# 新机器先安装 MySQL、准备账号和数据库，再显式升级结构；已有文件不会自动导入。

[mysql]
host = "127.0.0.1" # 本机数据库；可选 127.0.0.1/localhost/::1，默认 127.0.0.1。
port = 3306 # 数据库端口，整数 1～65535，默认 3306。
database = "taobao_automation" # 正式库；独立合成测试在本地副本中改为 taobao_automation_verify。
user = "root" # 日常读写、后台采集与结构升级共用的账号；本机使用已有 root。
password = "" # 仅在本地 settings.toml 填写；显式空值会阻止连接。
connect_timeout = 5 # 连接超时，整数秒 1～30，默认 5。
# 如需环境变量兼容模式，删除 password 项后再启用下面这一项。
# password_env = "ECOMMERCE_MYSQL_PASSWORD"
# credentials_file 是程序内部引用，不能手工加入本配置。
