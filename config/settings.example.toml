# 相对路径统一基于项目根目录，可通过 ECOMMERCE_ROOT 覆盖根目录。
workspace = "workspace"
shop_name = "我的店铺"

[browser]
headless = false
timeout_ms = 60000
# 未设置时优先兼容根目录 state.json 和 storage/taobao_browser_profile。
# session_path = "workspace/storage/sessions/qianniu.json"
# profile_path = "workspace/storage/browser_profiles/qianniu"

[taobao]
# 可选使用已安装的系统 Chrome 或 Edge 做兼容性对照；默认使用自带 Chromium。
# browser_channel = "chrome" # chrome 或 msedge；不影响千牛
# browser_mode = "native_cdp" # 普通启动连接模式，需要 chrome、可见窗口；默认 playwright
# 淘宝买家端独立登录，不复用千牛及旧版资料；以下为默认路径。
# session_path = "workspace/storage/sessions/taobao.json"
# profile_path = "workspace/storage/browser_profiles/taobao"

[taobao.pacing]
# 页面就绪后附加的随机间隔（秒）；仅用于显式调用对应动作的采集步骤。
before_search = [2, 4] # 填写关键词后、点击搜索前
search = [2, 4]
scroll = [1.5, 3]
page = [4, 8]
keyword = [8, 15]
question = [4, 8] # 问大家逐题操作间隔
question_rest = [30, 60] # 每10题或连续操作5分钟休息；等待可暂停/停止

[web]
host = "127.0.0.1"
port = 8000

[storage]
# 新环境先保持旧任务源；正式导入核对通过后才设为 mysql，避免指向空库。
task_backend = "sqlite"
# 采集历史导入并核对后才改为 mysql；启用时 task_backend 也必须为 mysql。
collection_backend = "files"

[mysql]
# 新环境的独立验证配置；本项目本机实际配置已使用正式库 taobao_automation。
host = "127.0.0.1"
port = 3306
database = "taobao_automation_verify"
user = "taobao_app"
password_env = "ECOMMERCE_MYSQL_PASSWORD"
migration_user = "taobao_migrator"
migration_password_env = "ECOMMERCE_MYSQL_MIGRATION_PASSWORD"
connect_timeout = 5
