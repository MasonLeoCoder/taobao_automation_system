<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问大家分析报告</title><body><h1>问大家竞品与选品报告</h1><p>仅限本批采集样本；引用匹配不代表结论语义或性能已验证。</p>{{ rendered|safe }}<hr><h2>问题与回答原文</h2>{% for source in data.sources %}<details id="question-{{ source.question_id }}"><summary>问题 {{ source.question_id }}：{{ source.snapshot.text }}</summary>{% for answer in source.snapshot.answers %}<p id="answer-{{ answer.id }}">回答 {{ answer.id }}：{{ answer.text }}</p>{% endfor %}</details>{% endfor %}</body></html>
